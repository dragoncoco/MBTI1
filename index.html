
<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>MBTI로 포켓몬 찾기</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      padding: 30px 16px;
      min-height: 100vh;
      font-family: "Malgun Gothic", "Apple SD Gothic Neo",
                   sans-serif;
      background: #fff8e8;
      color: #493b2a;
      text-align: center;
    }

    .container {
      width: 100%;
      max-width: 760px;
      margin: 0 auto;
    }

    .top-label {
      display: inline-block;
      padding: 9px 16px;
      border-radius: 30px;
      background: #ffebaa;
      color: #79551b;
      font-size: 15px;
      font-weight: bold;
      margin-bottom: 16px;
    }

    h1 {
      margin: 0;
      font-size: clamp(30px, 6vw, 44px);
      line-height: 1.35;
      color: #604622;
    }

    .subtitle {
      margin: 14px 0 28px;
      font-size: 17px;
      line-height: 1.8;
      color: #796c59;
    }

    .panel {
      padding: 26px 22px;
      background: #ffffff;
      border: 2px solid #f5e4b9;
      border-radius: 26px;
      box-shadow: 0 8px 24px rgba(130, 99, 37, 0.08);
    }

    .section-title {
      margin: 0 0 8px;
      font-size: 23px;
      color: #604622;
    }

    .section-description {
      margin: 0 0 22px;
      color: #8b7b65;
      font-size: 15px;
    }

    .mbti-grid {
      display: grid;
      grid-template-columns: repeat(4, minmax(0, 1fr));
      gap: 10px;
    }

    .mbti-button {
      min-height: 56px;
      border: 2px solid #f1e4c8;
      border-radius: 15px;
      background: #fffaf0;
      color: #634c2b;
      font-size: 18px;
      font-weight: bold;
      cursor: pointer;
      transition: 0.18s ease;
    }

    .mbti-button:hover {
      background: #ffedb6;
      border-color: #e8c65f;
      transform: translateY(-2px);
    }

    .mbti-button:focus-visible,
    .again-button:focus-visible {
      outline: 3px solid #bd8722;
      outline-offset: 3px;
    }

    .mbti-button.selected {
      background: #ffdc79;
      border-color: #dcae37;
      color: #573d0e;
    }

    .result {
      display: none;
      margin-top: 24px;
      padding: 28px 22px;
      background: #fff1bd;
      border: 2px solid #f0d675;
      border-radius: 26px;
      animation: appear 0.3s ease;
    }

    .result.show {
      display: block;
    }

    @keyframes appear {
      from {
        opacity: 0;
        transform: translateY(8px);
      }
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    .result-label {
      display: inline-block;
      padding: 7px 13px;
      border-radius: 20px;
      background: #fffaf0;
      color: #87621d;
      font-size: 14px;
      font-weight: bold;
    }

    .pokemon-emoji {
      margin: 16px 0 8px;
      font-size: clamp(80px, 17vw, 120px);
      line-height: 1.3;
    }

    .pokemon-name {
      margin: 0;
      color: #533d1d;
      font-size: 34px;
    }

    .pokemon-type {
      margin: 10px 0 22px;
      color: #82652f;
      font-size: 16px;
      font-weight: bold;
    }

    .reason-box {
      padding: 20px;
      border-radius: 18px;
      background: rgba(255, 255, 255, 0.75);
      text-align: left;
    }

    .reason-box h3 {
      margin: 0 0 12px;
      font-size: 19px;
      color: #604622;
    }

    .reason-box p {
      margin: 0;
      font-size: 16px;
      line-height: 1.9;
      color: #62523c;
      word-break: keep-all;
    }

    .compatibility {
      margin-top: 16px;
      padding: 19px;
      border-radius: 18px;
      background: #fffaf0;
      text-align: left;
    }

    .compatibility h3 {
      margin: 0 0 9px;
      font-size: 19px;
      color: #604622;
    }

    .compatibility p {
      margin: 0;
      font-size: 16px;
      line-height: 1.8;
      color: #62523c;
    }

    .again-button {
      width: 100%;
      max-width: 260px;
      margin-top: 22px;
      padding: 15px 20px;
      border: none;
      border-radius: 16px;
      background: #d99c35;
      color: white;
      font-size: 17px;
      font-weight: bold;
      cursor: pointer;
      transition: 0.2s;
    }

    .again-button:hover {
      background: #bd8120;
      transform: translateY(-2px);
    }

    .footer {
      margin-top: 24px;
      color: #a18d6d;
      font-size: 13px;
      line-height: 1.8;
    }

    @media (max-width: 480px) {
      body {
        padding: 22px 12px;
      }

      .panel {
        padding: 22px 14px;
      }

      .mbti-grid {
        grid-template-columns: repeat(4, minmax(0, 1fr));
        gap: 7px;
      }

      .mbti-button {
        min-height: 49px;
        font-size: 15px;
        border-radius: 11px;
      }

      .result {
        padding: 23px 15px;
      }

      .pokemon-name {
        font-size: 30px;
      }

      .reason-box,
      .compatibility {
        padding: 16px;
      }
    }
  </style>
</head>

<body>
  <main class="container">
    <div class="top-label">🌼 나만의 포켓몬 찾기</div>

    <h1>MBTI로<br>포켓몬 찾기!</h1>

    <p class="subtitle">
      나의 MBTI를 선택하면<br>
      나와 어울리는 포켓몬을 찾아드려요! ✨
    </p>

    <section class="panel" aria-labelledby="select-title">
      <h2 class="section-title" id="select-title">
        나의 MBTI는?
      </h2>
      <p class="section-description">
        16가지 유형 중 하나를 선택해 보세요.
      </p>

      <div class="mbti-grid" id="mbtiGrid">
        <button class="mbti-button" data-mbti="ISTJ">ISTJ</button>
        <button class="mbti-button" data-mbti="ISFJ">ISFJ</button>
        <button class="mbti-button" data-mbti="INFJ">INFJ</button>
        <button class="mbti-button" data-mbti="INTJ">INTJ</button>
        <button class="mbti-button" data-mbti="ISTP">ISTP</button>
        <button class="mbti-button" data-mbti="ISFP">ISFP</button>
        <button class="mbti-button" data-mbti="INFP">INFP</button>
        <button class="mbti-button" data-mbti="INTP">INTP</button>
        <button class="mbti-button" data-mbti="ESTP">ESTP</button>
        <button class="mbti-button" data-mbti="ESFP">ESFP</button>
        <button class="mbti-button" data-mbti="ENFP">ENFP</button>
        <button class="mbti-button" data-mbti="ENTP">ENTP</button>
        <button class="mbti-button" data-mbti="ESTJ">ESTJ</button>
        <button class="mbti-button" data-mbti="ESFJ">ESFJ</button>
        <button class="mbti-button" data-mbti="ENFJ">ENFJ</button>
        <button class="mbti-button" data-mbti="ENTJ">ENTJ</button>
      </div>
    </section>

    <section
      class="result"
      id="result"
      aria-live="polite"
      aria-atomic="true"
      aria-labelledby="pokemonName"
    >
      <span class="result-label" id="resultMbti">
        나의 유형
      </span>

      <div class="pokemon-emoji" id="pokemonEmoji">⚡</div>

      <h2 class="pokemon-name" id="pokemonName">
        피카츄
      </h2>

      <p class="pokemon-type" id="pokemonType">
        밝고 에너지 넘치는 포켓몬
      </p>

      <div class="reason-box">
        <h3>💛 이 포켓몬이 어울리는 이유</h3>
        <p id="pokemonReason"></p>
      </div>

      <div class="compatibility">
        <h3>🤝 나와 잘 맞는 MBTI</h3>
        <p id="compatibilityText"></p>
      </div>

      <button class="again-button" id="againButton">
        ↩ 다시 고르기
      </button>
    </section>

    <p class="footer">
      🍯 MBTI와 포켓몬의 성격을 재미로 연결한 콘텐츠입니다.<br>
      실제 성격이나 궁합을 과학적으로 판정하는 검사는 아니에요!
    </p>
  </main>

  <script>
    // 각 MBTI 유형에 어울리는 포켓몬과 설명을 저장합니다.
    const pokemonData = {
      ISTJ: {
        name: "거북왕",
        emoji: "🐢",
        type: "책임감 있고 믿음직한 포켓몬",
        reason: "맡은 일을 끝까지 해내는 성실함이 ISTJ와 닮았어요.\n차분하게 상황을 살피고, 자신만의 원칙을 지키는 모습도 잘 어울려요.",
        match: "ESFP",
        matchReason: "계획적인 ISTJ와 활기찬 ESFP는 서로에게 새로운 관점을 알려 줄 수 있어요."
      },
      ISFJ: {
        name: "해피너스",
        emoji: "🥚",
        type: "다정하고 배려심 많은 포켓몬",
        reason: "주변 사람들을 세심하게 챙기는 모습이 ISFJ와 닮았어요.\n다른 사람에게 안정감과 따뜻함을 주는 점도 잘 어울려요.",
        match: "ESFP",
        matchReason: "서로를 잘 챙기는 마음에 즐거운 에너지까지 더해져 편안한 관계를 만들 수 있어요."
      },
      INFJ: {
        name: "뮤",
        emoji: "🩷",
        type: "신비롭고 상상력이 풍부한 포켓몬",
        reason: "깊이 생각하고 자신만의 가치관을 소중히 여기는 점이 INFJ와 닮았어요.\n조용하지만 풍부한 내면과 따뜻한 마음도 잘 어울려요.",
        match: "ENFP",
        matchReason: "INFJ의 깊은 생각과 ENFP의 호기심이 만나 서로의 세계를 넓혀 줄 수 있어요."
      },
      INTJ: {
        name: "뮤츠",
        emoji: "🧬",
        type: "분석적이고 독립적인 포켓몬",
        reason: "목표를 세우고 효율적인 방법을 찾는 모습이 INTJ와 닮았어요.\n복잡한 문제를 논리적으로 분석하는 이미지도 잘 어울려요.",
        match: "ENFP",
        matchReason: "전략을 중시하는 INTJ와 새로운 가능성을 즐기는 ENFP는 서로의 부족한 부분을 보완할 수 있어요."
      },
      ISTP: {
        name: "메타몽",
        emoji: "🟣",
        type: "유연하고 적응력이 뛰어난 포켓몬",
        reason: "필요한 순간에 상황을 빠르게 파악하는 점이 ISTP와 닮았어요.\n정해진 방식에 얽매이지 않고 실용적인 해결책을 찾는 모습도 어울려요.",
        match: "ESTJ",
        matchReason: "ISTP의 유연한 문제 해결 능력과 ESTJ의 체계적인 실행력이 서로에게 도움이 될 수 있어요."
      },
      ISFP: {
        name: "이브이",
        emoji: "🦊",
        type: "자유롭고 매력적인 포켓몬",
        reason: "자신만의 취향과 감성을 소중히 여기는 점이 ISFP와 닮았어요.\n여러 가능성을 지니고 자연스럽게 자신을 표현하는 모습도 어울려요.",
        match: "ENFJ",
        matchReason: "ISFP의 섬세한 감성과 ENFJ의 따뜻한 배려가 만나 서로를 이해하는 데 도움이 될 수 있어요."
      },
      INFP: {
        name: "피카츄",
        emoji: "⚡",
        type: "순수하고 마음이 따뜻한 포켓몬",
        reason: "자신이 소중하게 생각하는 마음과 관계를 지키는 점이 INFP와 닮았어요.\n상상력이 풍부하고 진심을 중요하게 여기는 모습도 잘 어울려요.",
        match: "ENFJ",
        matchReason: "INFP의 진솔한 마음과 ENFJ의 따뜻한 소통이 만나 서로에게 힘이 되어 줄 수 있어요."
      },
      INTP: {
        name: "후딘",
        emoji: "🥄",
        type: "지적 호기심이 강한 포켓몬",
        reason: "궁금한 것을 깊이 파고들고 원리를 이해하려는 점이 INTP와 닮았어요.\n논리적으로 분석하고 독창적인 생각을 떠올리는 모습도 어울려요.",
        match: "ENTJ",
        matchReason: "INTP의 아이디어와 ENTJ의 추진력이 만나 생각을 실제 계획으로 발전시키는 데 도움이 될 수 있어요."
      },
      ESTP: {
        name: "루카리오",
        emoji: "🥊",
        type: "대담하고 행동력이 뛰어난 포켓몬",
        reason: "생각에만 머무르지 않고 직접 부딪쳐 보는 모습이 ESTP와 닮았어요.\n상황에 빠르게 대응하고 기회를 포착하는 점도 잘 어울려요.",
        match: "ISFJ",
        matchReason: "ESTP의 적극적인 행동력과 ISFJ의 세심함이 서로 다른 강점을 살리는 데 도움이 될 수 있어요."
      },
      ESFP: {
        name: "푸린",
        emoji: "🎤",
        type: "밝고 사랑스러운 포켓몬",
        reason: "분위기를 즐기고 주변에 활기를 더하는 모습이 ESFP와 닮았어요.\n감정을 솔직하게 표현하고 순간을 즐기는 점도 잘 어울려요.",
        match: "ISTJ",
        matchReason: "ESFP의 생동감과 ISTJ의 안정감이 만나 서로에게 새로운 경험과 균형을 줄 수 있어요."
      },
      ENFP: {
        name: "토게피",
        emoji: "🐣",
        type: "호기심 많고 긍정적인 포켓몬",
        reason: "새로운 가능성을 발견하고 다양한 경험을 즐기는 점이 ENFP와 닮았어요.\n주변에 희망과 즐거움을 전하는 밝은 이미지도 잘 어울려요.",
        match: "INFJ",
        matchReason: "ENFP의 활발한 아이디어와 INFJ의 깊이 있는 시선이 만나 의미 있는 대화를 나눌 수 있어요."
      },
      ENTP: {
        name: "팬텀",
        emoji: "👻",
        type: "재치 있고 장난기 많은 포켓몬",
        reason: "기존의 방식에 의문을 품고 새로운 생각을 즐기는 점이 ENTP와 닮았어요.\n재치 있는 발상과 예측하기 어려운 매력도 잘 어울려요.",
        match: "INTJ",
        matchReason: "ENTP의 다양한 발상과 INTJ의 전략적인 사고가 만나 흥미로운 아이디어를 발전시킬 수 있어요."
      },
      ENTJ: {
        name: "리자몽",
        emoji: "🐉",
        type: "강한 추진력을 가진 포켓몬",
        reason: "뚜렷한 목표를 세우고 적극적으로 나아가는 모습이 ENTJ와 닮았어요.\n어려운 상황에서도 주도적으로 해결책을 찾는 이미지도 잘 어울려요.",
        match: "INTP",
        matchReason: "ENTJ의 실행력과 INTP의 분석력이 만나 계획을 더 논리적이고 구체적으로 다듬을 수 있어요."
      },
      ESTJ: {
        name: "윈디",
        emoji: "🐕",
        type: "든든하고 책임감 있는 포켓몬",
        reason: "체계적으로 일을 진행하고 맡은 역할을 지키는 점이 ESTJ와 닮았어요.\n주변을 이끌고 약속을 중요하게 여기는 모습도 잘 어울려요.",
        match: "ISTP",
        matchReason: "ESTJ의 조직력과 ISTP의 실용적인 판단이 만나 문제를 효율적으로 해결할 수 있어요."
      },
      ESFJ: {
        name: "파치리스",
        emoji: "🐿️",
        type: "사교적이고 정이 많은 포켓몬",
        reason: "주변 사람들과 잘 어울리고 관계를 소중히 여기는 점이 ESFJ와 닮았어요.\n작은 일에도 마음을 쓰고 함께하는 즐거움을 만드는 모습도 어울려요.",
        match: "ISFP",
        matchReason: "ESFJ의 적극적인 배려와 ISFP의 섬세한 감성이 만나 편안하고 따뜻한 관계를 만들 수 있어요."
      },
      ENFJ: {
        name: "가디안",
        emoji: "✨",
        type: "공감 능력이 뛰어난 포켓몬",
        reason: "다른 사람의 마음을 살피고 도움을 주려는 모습이 ENFJ와 닮았어요.\n사람들에게 용기를 주고 함께 성장하려는 점도 잘 어울려요.",
        match: "INFP",
        matchReason: "ENFJ의 다정한 소통과 INFP의 진솔한 마음이 만나 서로를 깊이 이해할 수 있어요."
      },
      ENTJ: {
        name: "망나뇽",
        emoji: "🐲",
        type: "강인하고 목표 지향적인 포켓몬",
        reason: "큰 목표를 향해 꾸준히 나아가는 모습이 ENTJ와 닮았어요.\n어려움 속에서도 방향을 잡고 결단력 있게 행동하는 이미지가 잘 어울려요.",
        match: "INTP",
        matchReason: "ENTJ의 추진력과 INTP의 논리적인 분석이 만나 더 탄탄한 계획을 세울 수 있어요."
      }
    };

    const buttons = document.querySelectorAll(".mbti-button");
    const result = document.getElementById("result");
    const againButton = document.getElementById("againButton");

    function chooseMBTI(mbti) {
      const data = pokemonData[mbti];

      if (!data) return;

      // 버튼 선택 상태 표시
      buttons.forEach(function(button) {
        const isSelected = button.dataset.mbti === mbti;
        button.classList.toggle("selected", isSelected);
        button.setAttribute("aria-pressed", String(isSelected));
      });

      // 선택한 유형과 포켓몬 정보 표시
      document.getElementById("resultMbti").textContent =
        "나의 MBTI · " + mbti;

      document.getElementById("pokemonEmoji").textContent =
        data.emoji;

      document.getElementById("pokemonName").textContent =
        data.name;

      document.getElementById("pokemonType").textContent =
        data.type;

      document.getElementById("pokemonReason").textContent =
        data.reason;

      // 줄바꿈이 적용되도록 설정
      document.getElementById("pokemonReason").style.whiteSpace =
        "pre-line";

      document.getElementById("compatibilityText").textContent =
        data.match + " — " + data.matchReason;

      result.classList.add("show");

      // 결과가 화면에 나타나는 위치로 부드럽게 이동
      result.scrollIntoView({
        behavior: "smooth",
        block: "nearest"
      });
    }

    // 16가지 MBTI 버튼에 클릭 이벤트 연결
    buttons.forEach(function(button) {
      button.addEventListener("click", function() {
        chooseMBTI(button.dataset.mbti);
      });
    });

    // 다시 고르기: 결과를 숨기고 선택 상태 초기화
    againButton.addEventListener("click", function() {
      result.classList.remove("show");

      buttons.forEach(function(button) {
        button.classList.remove("selected");
        button.setAttribute("aria-pressed", "false");
      });

      document.getElementById("select-title").scrollIntoView({
        behavior: "smooth",
        block: "start"
      });
    });

    // 페이지를 처음 열었을 때 선택 상태 초기화
    buttons.forEach(function(button) {
      button.setAttribute("aria-pressed", "false");
    });
  </script>
</body>
</html>
