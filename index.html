
<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MBTI로 포켓몬 찾기</title>
<style>
*{box-sizing:border-box}
:root{--cream:#fff8e8;--yellow:#ffdf83;--gold:#d69b32;--brown:#594326;--muted:#806f56;--line:#f0dfb7}
body{margin:0;padding:28px 15px;background:var(--cream);color:var(--brown);font-family:"Malgun Gothic","Apple SD Gothic Neo",sans-serif;text-align:center}
main{max-width:780px;margin:0 auto}
.pill{display:inline-block;padding:9px 15px;background:#ffedb6;border-radius:30px;font-weight:700;color:#805b1d;font-size:14px}
h1{font-size:clamp(31px,6vw,45px);line-height:1.3;margin:17px 0 10px}
.intro{font-size:17px;line-height:1.8;color:var(--muted);margin:0 0 27px}
.panel{background:#fff;border:2px solid var(--line);border-radius:25px;padding:25px 20px;box-shadow:0 8px 24px #82632512}
h2{margin:0 0 8px;font-size:24px}
.hint{margin:0 0 20px;color:#95836a;font-size:15px}
.grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px}
.mbti{min-height:54px;border:2px solid var(--line);border-radius:14px;background:#fffaf0;color:#654b27;font-size:18px;font-weight:700;cursor:pointer;transition:.18s}
.mbti:hover,.mbti:focus-visible{background:#ffedb6;border-color:#e3bf50;transform:translateY(-2px)}
.mbti.selected{background:var(--yellow);border-color:var(--gold)}
.result{display:none;margin-top:23px;padding:26px 20px;background:#fff0b9;border:2px solid #efd46d;border-radius:25px}
.result.show{display:block;animation:pop .25s ease}
@keyframes pop{from{opacity:0;transform:translateY(7px)}to{opacity:1;transform:translateY(0)}}
.tag{display:inline-block;background:#fffaf0;border-radius:20px;padding:7px 13px;font-weight:700;font-size:14px;color:#89621d}
.artwork-wrap{width:min(250px,70vw);height:230px;margin:12px auto 5px;display:flex;align-items:center;justify-content:center}
.artwork{display:block;max-width:100%;max-height:100%;object-fit:contain;filter:drop-shadow(0 8px 7px #80642b20)}
.art-fallback{display:none;font-size:90px}
.pokemon-name{font-size:34px;margin:5px 0;color:#533d1d}
.pokemon-type{margin:8px 0 21px;color:#82652f;font-weight:700}
.info{background:#ffffffc9;border-radius:17px;padding:18px;text-align:left;margin-top:13px}
.info h3{margin:0 0 9px;font-size:19px}
.info p{margin:0;white-space:pre-line;font-size:16px;line-height:1.9;color:#62523c;word-break:keep-all}
.again{margin-top:21px;padding:14px 20px;width:min(270px,100%);border:0;border-radius:15px;background:var(--gold);color:white;font-size:17px;font-weight:700;cursor:pointer}
.again:hover{background:#bd8120}
footer{margin-top:23px;color:#a18d6d;font-size:13px;line-height:1.8}
@media(max-width:480px){body{padding:22px 11px}.panel{padding:21px 12px}.grid{gap:7px}.mbti{min-height:48px;font-size:15px;border-radius:11px}.result{padding:22px 13px}.artwork-wrap{height:200px}.pokemon-name{font-size:30px}.info{padding:15px}}
</style>
</head>
<body>
<main>
  <div class="pill">🌼 나만의 포켓몬 찾기</div>
  <h1>MBTI로<br>포켓몬 찾기!</h1>
  <p class="intro">나의 MBTI를 선택하면<br>나와 어울리는 포켓몬을 찾아드려요! ✨</p>

  <section class="panel" aria-labelledby="selectTitle">
    <h2 id="selectTitle">나의 MBTI는?</h2>
    <p class="hint">16가지 유형 중 하나를 선택해 보세요.</p>
    <div class="grid" id="grid">
      <button class="mbti" data-type="ISTJ">ISTJ</button>
      <button class="mbti" data-type="ISFJ">ISFJ</button>
      <button class="mbti" data-type="INFJ">INFJ</button>
      <button class="mbti" data-type="INTJ">INTJ</button>
      <button class="mbti" data-type="ISTP">ISTP</button>
      <button class="mbti" data-type="ISFP">ISFP</button>
      <button class="mbti" data-type="INFP">INFP</button>
      <button class="mbti" data-type="INTP">INTP</button>
      <button class="mbti" data-type="ESTP">ESTP</button>
      <button class="mbti" data-type="ESFP">ESFP</button>
      <button class="mbti" data-type="ENFP">ENFP</button>
      <button class="mbti" data-type="ENTP">ENTP</button>
      <button class="mbti" data-type="ESTJ">ESTJ</button>
      <button class="mbti" data-type="ESFJ">ESFJ</button>
      <button class="mbti" data-type="ENFJ">ENFJ</button>
      <button class="mbti" data-type="ENTJ">ENTJ</button>
    </div>
  </section>

  <section class="result" id="result" aria-live="polite" aria-atomic="true">
    <span class="tag" id="chosenType"></span>
    <div class="artwork-wrap">
      <img class="artwork" id="artwork" src="" alt="" referrerpolicy="no-referrer">
      <div class="art-fallback" id="fallback" aria-hidden="true">⭐</div>
    </div>
    <h2 class="pokemon-name" id="pokemonName"></h2>
    <p class="pokemon-type" id="pokemonType"></p>
    <div class="info">
      <h3>💛 이 포켓몬이 어울리는 이유</h3>
      <p id="reason"></p>
    </div>
    <div class="info">
      <h3>🤝 나와 잘 맞는 MBTI</h3>
      <p id="match"></p>
    </div>
    <button class="again" id="again">↩ 다시 고르기</button>
  </section>

  <footer>
    포켓몬 이미지는 Pokémon 공식 사이트의 이미지 주소를 사용합니다.<br>
    이미지를 불러오려면 인터넷 연결이 필요합니다.<br>
    MBTI 매칭과 궁합은 재미를 위한 콘텐츠이며 공식 성격 검사가 아닙니다.
  </footer>
</main>

<script>
const pokemon = {
 ISTJ:{name:"거북왕",number:"009",type:"책임감 있고 믿음직한 포켓몬",reason:"맡은 일을 끝까지 해내는 성실함이 ISTJ와 닮았어요.\n차분하게 상황을 살피고 자신만의 원칙을 지키는 모습도 잘 어울려요.",match:"ESFP",matchReason:"계획적인 ISTJ와 활기찬 ESFP는 서로에게 새로운 관점을 알려 줄 수 있어요."},
 ISFJ:{name:"해피너스",number:"242",type:"다정하고 배려심 많은 포켓몬",reason:"주변 사람들을 세심하게 챙기는 모습이 ISFJ와 닮았어요.\n다른 사람에게 안정감과 따뜻함을 주는 점도 잘 어울려요.",match:"ESFP",matchReason:"서로를 잘 챙기는 마음에 즐거운 에너지까지 더해져 편안한 관계를 만들 수 있어요."},
 INFJ:{name:"뮤",number:"151",type:"신비롭고 상상력이 풍부한 포켓몬",reason:"깊이 생각하고 자신만의 가치관을 소중히 여기는 점이 INFJ와 닮았어요.\n조용하지만 풍부한 내면과 따뜻한 마음도 잘 어울려요.",match:"ENFP",matchReason:"INFJ의 깊은 생각과 ENFP의 호기심이 만나 서로의 세계를 넓혀 줄 수 있어요."},
 INTJ:{name:"뮤츠",number:"150",type:"분석적이고 독립적인 포켓몬",reason:"목표를 세우고 효율적인 방법을 찾는 모습이 INTJ와 닮았어요.\n복잡한 문제를 논리적으로 분석하는 이미지도 잘 어울려요.",match:"ENFP",matchReason:"전략을 중시하는 INTJ와 새로운 가능성을 즐기는 ENFP는 서로의 부족한 부분을 보완할 수 있어요."},
 ISTP:{name:"메타몽",number:"132",type:"유연하고 적응력이 뛰어난 포켓몬",reason:"필요한 순간에 상황을 빠르게 파악하는 점이 ISTP와 닮았어요.\n정해진 방식에 얽매이지 않고 실용적인 해결책을 찾는 모습도 어울려요.",match:"ESTJ",matchReason:"ISTP의 유연한 문제 해결 능력과 ESTJ의 체계적인 실행력이 서로에게 도움이 될 수 있어요."},
 ISFP:{name:"이브이",number:"133",type:"자유롭고 매력적인 포켓몬",reason:"자신만의 취향과 감성을 소중히 여기는 점이 ISFP와 닮았어요.\n여러 가능성을 지니고 자연스럽게 자신을 표현하는 모습도 어울려요.",match:"ENFJ",matchReason:"ISFP의 섬세한 감성과 ENFJ의 따뜻한 배려가 만나 서로를 이해하는 데 도움이 될 수 있어요."},
 INFP:{name:"피카츄",number:"025",type:"순수하고 마음이 따뜻한 포켓몬",reason:"자신이 소중하게 생각하는 마음과 관계를 지키는 점이 INFP와 닮았어요.\n상상력이 풍부하고 진심을 중요하게 여기는 모습도 잘 어울려요.",match:"ENFJ",matchReason:"INFP의 진솔한 마음과 ENFJ의 따뜻한 소통이 만나 서로에게 힘이 되어 줄 수 있어요."},
 INTP:{name:"후딘",number:"065",type:"지적 호기심이 강한 포켓몬",reason:"궁금한 것을 깊이 파고들고 원리를 이해하려는 점이 INTP와 닮았어요.\n논리적으로 분석하고 독창적인 생각을 떠올리는 모습도 어울려요.",match:"ENTJ",matchReason:"INTP의 아이디어와 ENTJ의 추진력이 만나 생각을 실제 계획으로 발전시키는 데 도움이 될 수 있어요."},
 ESTP:{name:"루카리오",number:"448",type:"대담하고 행동력이 뛰어난 포켓몬",reason:"생각에만 머무르지 않고 직접 부딪쳐 보는 모습이 ESTP와 닮았어요.\n상황에 빠르게 대응하고 기회를 포착하는 점도 잘 어울려요.",match:"ISFJ",matchReason:"ESTP의 적극적인 행동력과 ISFJ의 세심함이 서로 다른 강점을 살리는 데 도움이 될 수 있어요."},
 ESFP:{name:"푸린",number:"039",type:"밝고 사랑스러운 포켓몬",reason:"분위기를 즐기고 주변에 활기를 더하는 모습이 ESFP와 닮았어요.\n감정을 솔직하게 표현하고 순간을 즐기는 점도 잘 어울려요.",match:"ISTJ",matchReason:"ESFP의 생동감과 ISTJ의 안정감이 만나 서로에게 새로운 경험과 균형을 줄 수 있어요."},
 ENFP:{name:"토게피",number:"175",type:"호기심 많고 긍정적인 포켓몬",reason:"새로운 가능성을 발견하고 다양한 경험을 즐기는 점이 ENFP와 닮았어요.\n주변에 희망과 즐거움을 전하는 밝은 이미지도 잘 어울려요.",match:"INFJ",matchReason:"ENFP의 활발한 아이디어와 INFJ의 깊이 있는 시선이 만나 의미 있는 대화를 나눌 수 있어요."},
 ENTP:{name:"팬텀",number:"094",type:"재치 있고 장난기 많은 포켓몬",reason:"기존의 방식에 의문을 품고 새로운 생각을 즐기는 점이 ENTP와 닮았어요.\n재치 있는 발상과 예측하기 어려운 매력도 잘 어울려요.",match:"INTJ",matchReason:"ENTP의 다양한 발상과 INTJ의 전략적인 사고가 만나 흥미로운 아이디어를 발전시킬 수 있어요."},
 ESTJ:{name:"윈디",number:"059",type:"든든하고 책임감 있는 포켓몬",reason:"체계적으로 일을 진행하고 맡은 역할을 지키는 점이 ESTJ와 닮았어요.\n주변을 이끌고 약속을 중요하게 여기는 모습도 잘 어울려요.",match:"ISTP",matchReason:"ESTJ의 조직력과 ISTP의 실용적인 판단이 만나 문제를 효율적으로 해결할 수 있어요."},
 ESFJ:{name:"파치리스",number:"417",type:"사교적이고 정이 많은 포켓몬",reason:"주변 사람들과 잘 어울리고 관계를 소중히 여기는 점이 ESFJ와 닮았어요.\n작은 일에도 마음을 쓰고 함께하는 즐거움을 만드는 모습도 어울려요.",match:"ISFP",matchReason:"ESFJ의 적극적인 배려와 ISFP의 섬세한 감성이 만나 편안하고 따뜻한 관계를 만들 수 있어요."},
 ENFJ:{name:"가디안",number:"282",type:"공감 능력이 뛰어난 포켓몬",reason:"다른 사람의 마음을 살피고 도움을 주려는 모습이 ENFJ와 닮았어요.\n사람들에게 용기를 주고 함께 성장하려는 점도 잘 어울려요.",match:"INFP",matchReason:"ENFJ의 다정한 소통과 INFP의 진솔한 마음이 만나 서로를 깊이 이해할 수 있어요."},
 ENTJ:{name:"리자몽",number:"006",type:"강한 추진력을 가진 포켓몬",reason:"뚜렷한 목표를 세우고 적극적으로 나아가는 모습이 ENTJ와 닮았어요.\n어려운 상황에서도 주도적으로 해결책을 찾는 이미지도 잘 어울려요.",match:"INTP",matchReason:"ENTJ의 실행력과 INTP의 논리적인 분석이 만나 더 탄탄한 계획을 세울 수 있어요."}
};

const buttons = document.querySelectorAll(".mbti");
const result = document.getElementById("result");
const artwork = document.getElementById("artwork");
const fallback = document.getElementById("fallback");

function showResult(type){
  const p = pokemon[type];
  if(!p) return;

  buttons.forEach(button=>{
    const selected = button.dataset.type === type;
    button.classList.toggle("selected", selected);
    button.setAttribute("aria-pressed", String(selected));
  });

  document.getElementById("chosenType").textContent = "나의 MBTI · " + type;
  document.getElementById("pokemonName").textContent = p.name;
  document.getElementById("pokemonType").textContent = p.type;
  document.getElementById("reason").textContent = p.reason;
  document.getElementById("match").textContent =
    p.match + " — " + p.matchReason;

  // 포켓몬 공식 사이트 이미지 주소
  artwork.alt = p.name + " 공식 포켓몬 이미지";
  artwork.style.display = "block";
  fallback.style.display = "none";
  artwork.onerror = function(){
    artwork.style.display = "none";
    fallback.style.display = "block";
  };
  artwork.src =
    "https://assets.pokemon.com/assets/cms2/img/pokedex/full/" +
    p.number + ".png";

  result.classList.add("show");
  result.scrollIntoView({behavior:"smooth", block:"nearest"});
}

buttons.forEach(button=>{
  button.addEventListener("click",()=>{
    showResult(button.dataset.type);
  });
});

document.getElementById("again").addEventListener("click",()=>{
  result.classList.remove("show");
  buttons.forEach(button=>{
    button.classList.remove("selected");
    button.setAttribute("aria-pressed","false");
  });
  document.getElementById("selectTitle").scrollIntoView({
    behavior:"smooth",
    block:"start"
  });
});

buttons.forEach(button=>{
  button.setAttribute("aria-pressed","false");
});
</script>
</body>
</html>
